# AgriSense Plant Disease — path configuration
# Every path used anywhere in the pipeline is derived from the two roots below.
# See plant-disease-implementation-plan.md section 1.1 for why Drive vs local
# are split this way: Drive is cold/durable storage, /content is the fast
# working disk that gets wiped every Colab session and fully rebuilt from Drive.

drive_root: "/content/drive/MyDrive/AgriSense_PlantDisease"
local_root: "/content/agrisense_pd"

# Sub-paths are relative to the roots above. Keys ending in _dir are directories.
drive:
  archives_dir: "archives"
  manifests_dir: "manifests"
  models_dir: "models"
  exported_dir: "exported"
  artifacts_dir: "artifacts"
  state_dir: "state"

local:
  raw_dir: "data/raw"
  clean_dir: "data/clean"
  stage1_dir: "data/stage1_species"
  stage2_dir: "data/stage2_disease"
  runs_dir: "runs"

# Datasets actually used for training (Stage 1 + Stage 2 taxonomy/manifest
# pipeline). Add a new dataset here (and to sources.yaml) and it flows
# through download/inspect/taxonomy/clean/manifest automatically — nothing
# else hardcodes dataset names. Digipathos is deliberately excluded:
# Embrapa's server refuses connections (confirmed ECONNREFUSED), so every
# downloader for it is dead. See sources.yaml's digipathos entry.
training_datasets:
  - plantvillage
  - plantwild
  - cassava
  - rice

# Test-only datasets — real-world images used for Phase E evaluation,
# NEVER merged into training (that would make the E1 "real-world accuracy"
# number meaningless).
eval_datasets:
  - plantdoc

seed: 42
