# Dataset acquisition sources for Phase A2.
# kind: kaggle | http | git | manual
# "manual" datasets/fallbacks require you to download the file yourself and
# drop it in <drive_root>/archives/<expected_archive> — download.py will tell
# you this explicitly if the automated path fails.

plantvillage:
  kind: kaggle
  slug: "mohitsingh1804/plantvillage"
  expected_archive: "plantvillage.zip"
  approx_size_mb: 800
  notes: >
    Requires kaggle.json in ~/.kaggle/. Folder convention inside is
    "Species___Condition".

digipathos:
  kind: digipathos_pip
  # Digipathos is NOT one big archive — Embrapa serves it as ~90+ separate
  # zip files, one per (crop, disorder) class, through a JSPUI collection
  # API. download.py uses the community `digipathos` PyPI package
  # (github.com/rodrigobressan/digipathos) to walk that API, downloading
  # each class's zip and extracting it into a PlantVillage-style
  # "<crop>___<disorder>" folder so it merges cleanly with the rest of the
  # pipeline. That package wraps a specific, unofficial API endpoint last
  # updated ~2019 — if Embrapa has since restructured its repository this
  # may fail; download.py falls through to manual instructions in that
  # case. Skipping Digipathos entirely and training on PlantVillage +
  # PlantDoc alone is a fully supported fallback (narrower species
  # coverage, everything else unchanged).
  doi_landing_page: "https://www.digipathos-rep.cnptia.embrapa.br"
  approx_size_mb: 1500
  approx_image_count: 46376
  notes: >
    If the automated pip-package path fails, browse the collection at the
    landing page above, download whichever per-crop/disorder zips you
    want, extract each into
    <local_root>/data/raw/digipathos/<crop>___<disorder>/, matching
    PlantVillage's folder-per-class convention. No need to re-run this
    script afterward — it detects the populated folder and moves on;
    proceed straight to inspect_structure.py (Phase A3). Labels are in
    Portuguese — handled by taxonomy.py's synonym table.

plantdoc:
  kind: git
  # Use the object-detection variant (images + Pascal VOC XML), not the
  # classification-folder variant — Phase E2 needs the bounding boxes.
  repo_url: "https://github.com/pratikkayal/PlantDoc-Object-Detection-Dataset.git"
  expected_archive: "plantdoc"  # cloned directory, not a zip
  approx_size_mb: 1700
  notes: >
    Cloned directly (git kind). Contains train/ and test/ folders with
    images and matching Pascal VOC .xml annotation files.
