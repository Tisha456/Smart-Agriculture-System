# Fly.io config for the AgriSense automation backend (backend/main.py).
# Deploy from the REPO ROOT: `fly launch` / `fly deploy` (not from backend/).
#
# `app` below is a placeholder — Fly app names are globally unique, so on
# first `fly launch` you'll likely need to pick a different one. Update this
# file (or let `fly launch` rewrite it) once you have the real name.
app = "agrisense-backend"
primary_region = "sin"

[build]
  dockerfile = "backend/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
